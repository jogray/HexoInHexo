name: hexo
services:
  blog:
    build:
      context: .
      target: builder
    # command: ["tail", "-f", "/dev/null"]

    volumes:
      - ./:/myapp
    ports:
      - "40000:4000"
    networks:
      - default
  release:
    build:
      context: .
      target: release
    ports:
      - "40001:4000"
    networks:
      - default

networks:
  default:
    driver: bridge